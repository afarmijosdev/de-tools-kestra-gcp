id: test_loop_02
namespace: zoomcamp

inputs:
  - id: taxi
    type: SELECT
    displayName: Select taxi type
    values: [yellow, green]
    defaults: yellow

  - id: year
    type: SELECT
    displayName: Select year
    values: ["2019", "2020"]
    defaults: "2019"

variables:
  file_prefix: "{{inputs.taxi}}_tripdata_{{inputs.year}}"
  staging_table: "public.{{inputs.taxi}}_tripdata_staging"
  table: "public.{{inputs.taxi}}_tripdata_{{inputs.year}}"
  month: ""
  file: ""
  uri: ""
  data: ""
  
tasks:
  - id: for_each
    type: io.kestra.plugin.core.flow.ForEach
    #values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    values: ["01", "02"]
      
    tasks:
      - id: hello_message
        type: io.kestra.plugin.core.log.Log
        message: "Month {{ taskrun.value }}"

      - id: updateVariables_month
        type: io.kestra.plugin.core.execution.SetVariables
        overwrite: true # true by default
        variables:
          month: "{{ taskrun.value  }}"

      - id: updateVariables_file
        type: io.kestra.plugin.core.execution.SetVariables
        overwrite: true # true by default
        variables:
          file: "{{vars.file_prefix}}-{{vars.month}}.csv"


      - id: updateVariables_uri
        type: io.kestra.plugin.core.execution.SetVariables
        overwrite: true # true by default
        variables:
          uri: "https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{{inputs.taxi}}/{{vars.file}}.gz"

      - id: hello_message_02
        type: io.kestra.plugin.core.log.Log
        message: 
          - "Month {{ render(vars.month) }}"
          - "File {{ render(vars.file) }}"
          - "URI {{ render(vars.uri) }}"
      
      - id: set_label
        type: io.kestra.plugin.core.execution.Labels
        labels:
          file: "{{render(vars.file)}}"
          taxi: "{{inputs.taxi}}"

      - id: extract
        type: io.kestra.plugin.scripts.shell.Commands
        outputFiles:
          - "*.csv"
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - wget -qO- https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{{inputs.taxi}}/{{render(vars.file)}}.gz | gunzip > {{render(vars.file)}}

      - id: updateVariables_data
        type: io.kestra.plugin.core.execution.SetVariables
        overwrite: true # true by default
        variables:
          data: "{{outputs['extract'][taskrun.value].outputFiles[inputs.taxi ~ '_tripdata_' ~ inputs.year ~ '-' ~ vars.month ~ '.csv']}}"

      - id: hello_message_03
        type: io.kestra.plugin.core.log.Log
        message: 
          - "Data {{ render(vars.data) }}"