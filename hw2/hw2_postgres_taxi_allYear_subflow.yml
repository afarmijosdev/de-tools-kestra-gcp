id: hw2_postgres_taxi_allYear_subflow
namespace: zoomcamp
description: |
  The CSV Data used in the course: https://github.com/DataTalksClub/nyc-tlc-data/releases

inputs:
  - id: taxi
    type: SELECT
    displayName: Select taxi type
    values: [yellow, green]
    defaults: yellow

  - id: year
    type: SELECT
    displayName: Select year
    values: ["2019", "2020","2021"]
    defaults: "2020"

tasks:

  - id: set_label
    type: io.kestra.plugin.core.execution.Labels
    labels:
      taxi: "{{ inputs.taxi }}"
      year: "{{ inputs.year }}"

  - id: for_each
    type: io.kestra.plugin.core.flow.ForEach
    values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]

    tasks:

      - id: Subflow_Process_per_month
        type: io.kestra.plugin.core.flow.Subflow
        flowId: hw2_postgres_taxi_per_month
        namespace: zoomcamp
        inputs:
          taxi: "{{ inputs.taxi }}"
          year: "{{ inputs.year }}"
          month: "{{ taskrun.value }}"
        wait: true